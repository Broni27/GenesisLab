<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>GENESIS LAB - Expert-Level Genetic Diagnostics in Baku</title>
    <style>
      /* Критические стили для предотвращения мигания */
      body {
        margin: 0;
        padding: 0;
        font-family: 'Montserrat', system-ui, sans-serif;
        background-color: #ffffff;
        color: #000000;
      }
      
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #0a0a0a;
          color: #ffffff;
        }
      }
      
      #root {
        opacity: 0;
        animation: rootFadeIn 0.3s ease-out 0.1s forwards;
      }
      
      @keyframes rootFadeIn {
        to {
          opacity: 1;
        }
      }
    </style>
    <script>
      // Применяем сохраненную тему до загрузки React
      (function() {
        const savedTheme = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = savedTheme || (prefersDark ? 'dark' : 'light');
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
